name: Calidad y promoción segura

on:
  push:
    branches:
      - develop
      - testing
      - main
  pull_request:
    branches:
      - develop
      - testing
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, TypeScript y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar TypeScript
        run: pnpm check

      - name: Ejecutar pruebas reproducibles
        # El perfil CI excluye únicamente pruebas que requieren servicios o secretos externos.
        run: pnpm exec vitest --config vitest.config.ci.ts --run --reporter=dot

      - name: Construir producción
        run: pnpm run build
